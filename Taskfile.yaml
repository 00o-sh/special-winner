---
# Root Taskfile - entry point for all task automation.
# Run `task --list` to see available tasks.
# Subtask files are in .taskfiles/ (bootstrap, talos, template, vm).
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap     # Cluster bootstrap (task bootstrap:talos, bootstrap:apps)
  talos: .taskfiles/talos             # Talos node operations (apply, upgrade, reset)
  template: .taskfiles/template       # Template rendering and validation (init, configure)
  vm: .taskfiles/vm                   # KubeVirt VM management (start, stop, console, redeploy)

tasks:

  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux
