---
# Root Taskfile - entry point for all task automation.
# Run `task --list` to see available tasks.
# Subtask files are in .taskfiles/ (bootstrap, talos, template, vm).
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  # Cluster name for multi-cluster support (override with: task <cmd> CLUSTER=<name>)
  CLUSTER: '{{.CLUSTER | default "3226"}}'
  CLUSTER_DIR: '{{.ROOT_DIR}}/clusters/{{.CLUSTER}}'
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'
  KUBECONFIG: '{{.CLUSTER_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.CLUSTER_DIR}}/age.key'

env:
  KUBECONFIG: '{{.KUBECONFIG}}'
  SOPS_AGE_KEY_FILE: '{{.SOPS_AGE_KEY_FILE}}'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap     # Cluster bootstrap (task bootstrap:talos, bootstrap:apps)
  talos: .taskfiles/talos             # Talos node operations (apply, upgrade, reset)
  template: .taskfiles/template       # Template rendering and validation (init, configure)
  vm: .taskfiles/vm                   # KubeVirt VM management (start, stop, console, redeploy)

tasks:

  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  failover:
    desc: Failover workloads to a cluster [CLUSTER=usny01]
    prompt: This will failover all workloads to cluster {{.CLUSTER}}... continue?
    cmds:
      - echo "{{.CLUSTER}}" > {{.ROOT_DIR}}/active-cluster
      - |
        for dir in {{.ROOT_DIR}}/kubernetes/flux/*/; do
          CLUSTER_NAME=$(basename "$dir")
          KS_FILE="${dir}ks.yaml"
          [ -f "$KS_FILE" ] || continue
          if [ "$CLUSTER_NAME" = "{{.CLUSTER}}" ]; then
            SUSPEND="false"
          else
            SUSPEND="true"
          fi
          echo "Setting SUSPEND_DEFAULT=${SUSPEND} for cluster ${CLUSTER_NAME}"
          yq -i '(.spec.postBuild.substitute.SUSPEND_DEFAULT) = "'"${SUSPEND}"'"' "$KS_FILE"
        done
    preconditions:
      - which yq
