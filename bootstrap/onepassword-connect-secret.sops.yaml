apiVersion: v1
kind: Secret
metadata:
  name: onepassword-secret
  namespace: external-secrets
type: Opaque
stringData:
  # 1Password Connect Server credentials
  # Generate at: https://my.1password.com/integrations/infrastructure-secrets
  1password-credentials.json: <REPLACE_WITH_1PASSWORD_CREDENTIALS_JSON>
  token: <REPLACE_WITH_CONNECT_TOKEN>
