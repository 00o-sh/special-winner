machine:
  features:
    kubernetesTalosAPIAccess:
      allowedKubernetesNamespaces:
        - system-upgrade # or the namespace the controller will be installed to
      allowedRoles:
        - os:admin
      enabled: true
  kubelet:
    extraConfig:
      serializeImagePulls: false
      featureGates:
        ImageVolume: true
    nodeIP:
      validSubnets:
        - 10.32.26.0/24
        - 192.168.56.0/24
