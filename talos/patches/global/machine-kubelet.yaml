machine:
  features:
    kubernetesTalosAPIAccess:
      allowedKubernetesNamespaces:
        - system-upgrade
        - actions-runner-system
        - forgejo-runner-system
      allowedRoles:
        - os:admin
      enabled: true
  kubelet:
    extraConfig:
      serializeImagePulls: false
      featureGates:
        ImageVolume: true
    nodeIP:
      validSubnets:
        - 10.0.6.0/24
        - 192.168.56.0/24
