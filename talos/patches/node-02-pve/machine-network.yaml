# Network configuration for node-02-pve (Proxmox VE VM)
# Bond interface matching bare metal setup
machine:
  network:
    interfaces:
      - interface: bond0
        bond:
          mode: active-backup
          deviceSelectors: [{ hardwareAddr: "bc:24:11:*" }]
        mtu: 1500
        dhcp: false
        addresses:
          - 10.0.6.213/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.6.1
