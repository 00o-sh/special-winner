---
# TODO: Configure rochelle cluster nodes when hardware comes online
# This is a placeholder — populate with actual node definitions before bootstrapping
clusterName: rochelle

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

# TODO: Replace with rochelle cluster endpoint IP
endpoint: https://10.0.7.10:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.0.7.10"  # TODO: Replace with actual rochelle VIP
additionalMachineCertSans: *sans

clusterPodNets: ["172.30.0.0/16"]
clusterSvcNets: ["172.31.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes: []
  # TODO: Add rochelle nodes here when hardware is available
  # Example:
  # - hostname: "rochelle-node-01"
  #   ipAddress: "10.0.7.211"
  #   installDisk: "/dev/sda"
  #   controlPlane: true
  #   patches:
  #     - "@../../shared/patches/vm-node/machine-kubelet.yaml"
  #   networkInterfaces:
  #     - interface: bond0
  #       bond:
  #         mode: active-backup
  #         deviceSelectors: [{ hardwareAddr: "xx:xx:xx:xx:xx:*" }]
  #       mtu: 1500
  #       dhcp: false
  #       addresses:
  #         - 10.0.7.211/24
  #       routes:
  #         - network: 0.0.0.0/0
  #           gateway: 10.0.7.1
  #       vip:
  #         ip: 10.0.7.10

# Global patches (shared across all clusters)
patches:
  - "@../../shared/patches/global/machine-files.yaml"
  - "@../../shared/patches/global/machine-kubelet.yaml"
  - "@../../shared/patches/global/machine-kubevirt.yaml"
  - "@../../shared/patches/global/machine-network.yaml"
  - "@../../shared/patches/global/machine-sysctls.yaml"
  - "@../../shared/patches/global/machine-time.yaml"
  - "@../../shared/patches/global/machine-vlan56.yaml"
  - "@../../shared/patches/global/machine-vlan57.yaml"

# Controller patches
controlPlane:
  patches:
    - "@../../shared/patches/controller/cluster.yaml"
