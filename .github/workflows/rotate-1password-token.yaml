---
# Rotates the 1Password Service Account token in SOPS-encrypted secret files.
# Requires GitHub Secrets: OP_SA_TOKEN (new token) and SOPS_AGE_KEY (age private key).
# Usage: Update the OP_SA_TOKEN secret, then trigger this workflow manually.
name: "1Password Token Rotation"

on:
  workflow_dispatch:

jobs:
  rotate-token:
    name: Rotate 1Password SA Token
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup SOPS
        uses: mdgreenwald/mozilla-sops-action@d9714e521cbaecdae64a89d2fdd576dd2aa97056 # v1.6.0

      - name: Setup age
        run: |
          curl -sSfL https://dl.filippo.io/age/latest?for=linux/amd64 | tar -xz -C /usr/local/bin/ age age-keygen

      - name: Rotate token in secret files
        env:
          SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
          OP_SA_TOKEN: "${{ secrets.OP_SA_TOKEN }}"
        run: |
          secret_files=(
            "kubernetes/apps/external-secrets/onepassword/app/secret.sops.yaml"
            "bootstrap/onepassword-secret.sops.yaml"
          )
          for file in "${secret_files[@]}"; do
            echo "Rotating token in ${file}"
            sops --decrypt --in-place "${file}"
            contents=$(yq '.stringData.token = env(OP_SA_TOKEN)' "${file}")
            echo "${contents}" > "${file}"
            sops --encrypt --in-place "${file}"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: chore/rotate-1password-token
          delete-branch: true
          title: "chore(kubernetes): rotate 1Password service account token"
          body: |
            ## Summary
            - Rotated 1Password Service Account token in SOPS-encrypted secret files

            ## Action Required
            After merging, run `task reconcile` to apply the new token to the cluster.
          commit-message: "chore(kubernetes): rotate 1Password service account token"
          signoff: false
