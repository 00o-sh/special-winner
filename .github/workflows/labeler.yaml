---
name: "Labeler"

on:
  workflow_dispatch:
  pull_request_target:
    branches: ["main"]

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label PR based on paths
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          configuration-path: .github/labeler.yaml
          sync-labels: true

      - name: Label PR based on size
        uses: codelytv/pr-size-labeler@56f6f0fc35c7cc0f72963b8467729e1851b0c25e # v1.10.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: "9"
          s_label: "size/s"
          s_max_size: "29"
          m_label: "size/m"
          m_max_size: "99"
          l_label: "size/l"
          l_max_size: "499"
          xl_label: "size/xl"
          fail_if_xl: "false"
          message_if_xl: >
            This PR is very large. Consider breaking it into smaller PRs for easier review.
          files_to_ignore: |
            *.md
            *.txt
            LICENSE
            .gitignore
