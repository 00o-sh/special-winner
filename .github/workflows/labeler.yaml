---
# Automatically labels PRs based on changed file paths (area/*) and size (xs/s/m/l/xl).
# Configuration: .github/labeler.yaml for path-to-label mapping.
name: "Labeler"

on:
  workflow_dispatch:
  pull_request_target:
    branches: ["main"]

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label PR based on paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
          sync-labels: true

      - name: Label PR based on size
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1.10.4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: "9"
          s_label: "size/s"
          s_max_size: "29"
          m_label: "size/m"
          m_max_size: "99"
          l_label: "size/l"
          l_max_size: "499"
          xl_label: "size/xl"
          fail_if_xl: "false"
          message_if_xl: >
            This PR is very large. Consider breaking it into smaller PRs for easier review.
          files_to_ignore: |
            *.md
            *.txt
            LICENSE
            .gitignore
