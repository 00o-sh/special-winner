---
# Auto-generates .github/labels.yaml and .github/labeler.yaml from repository structure.
# Keeps label definitions in sync with namespace and directory changes.
name: "Label Generate"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "kubernetes/apps/**/kustomization.yaml"
      - "scripts/generate-labels.sh"

jobs:
  generate:
    name: Generate Labels
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate Labels
        run: ./scripts/generate-labels.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet .github/labels.yaml .github/labeler.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(github): auto-generate labels from app structure"
          title: "chore(github): Update labels from kubernetes/apps structure"
          body: |
            This PR was automatically generated by the label generation workflow.

            ## Changes
            Labels and labeler rules have been regenerated based on the current
            `kubernetes/apps/` directory structure.

            ## What triggered this?
            - New namespace or app added
            - Existing namespace or app removed
            - Manual workflow trigger

            ---
            *Auto-generated by [label-generate.yaml](../blob/main/.github/workflows/label-generate.yaml)*
          branch: chore/update-labels
          delete-branch: true
          labels: |
            area/github
            type/chore
            auto-generated
          assignees: |
            @00o-sh
          reviewers: |
            @00o-sh