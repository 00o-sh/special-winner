---
# Area Labels - General
area/bootstrap:
  - changed-files:
      - any-glob-to-any-file:
          - bootstrap/**/*

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**/*
          - CLAUDE.md

area/github:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*

area/kubernetes:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/**/*

area/mise:
  - changed-files:
      - any-glob-to-any-file:
          - .mise.toml

area/renovate:
  - changed-files:
      - any-glob-to-any-file:
          - .renovate/**/*
          - .renovaterc.json5

area/scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**/*

area/talos:
  - changed-files:
      - any-glob-to-any-file:
          - talos/**/*

area/taskfile:
  - changed-files:
      - any-glob-to-any-file:
          - .taskfiles/**/*
          - Taskfile.yaml

area/templates:
  - changed-files:
      - any-glob-to-any-file:
          - templates/**/*
          - makejinja.toml

