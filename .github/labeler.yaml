          - kubernetes/apps/kubevirt/kubevirt/**/*
          - kubernetes/apps/kubevirt/cdi/**/*

component/kubevirt-vms:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/kubevirt/virtualmachines/**/*

component/spegel:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/kube-system/spegel/**/*

# Type Labels - Based on file patterns and commit messages
type/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**/*
          - .github/actions/**/*

type/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**/*
      - all-globs-to-all-files:
          - "!**/*.{yaml,yml,sh,py,toml,json}"

type/security:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.sops.yaml"
          - "**/*.sops.yml"
          - .sops.yaml
          - kubernetes/apps/external-secrets/**/*

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - .mise.toml
          - bootstrap/helmfile.d/**/*
