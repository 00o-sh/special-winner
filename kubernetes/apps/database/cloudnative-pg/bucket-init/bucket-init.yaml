---
apiVersion: batch/v1
kind: Job
metadata:
  name: cnpg-bucket-init
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cloudnative-pg-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudnative-pg-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: USTX01
          command:
            - /bin/sh
            - -c
            - |
              aws --endpoint-url http://garage-ha-app.volsync-system.svc.cluster.local:3900 \
                s3api head-bucket --bucket cnpg 2>/dev/null && \
                echo "Bucket cnpg already exists" && exit 0
              aws --endpoint-url http://garage-ha-app.volsync-system.svc.cluster.local:3900 \
                s3 mb s3://cnpg && \
                echo "Bucket cnpg created successfully"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
