---
# Strimzi Kafka cluster running in KRaft mode (no ZooKeeper). Single
# controller+broker pool, 3 nodes, one per cluster node via anti-affinity.
# Topics created on demand by consumers; defaults RF=3 / minISR=2 so
# losing one node doesn't break writes.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: openebs-hostpath
        deleteClaim: false
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1500Mi
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: "true"
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  # entityOperator: handles KafkaTopic / KafkaUser CRDs if anything
  # wants to manage topics declaratively later.
  entityOperator:
    topicOperator: {}
    userOperator: {}
