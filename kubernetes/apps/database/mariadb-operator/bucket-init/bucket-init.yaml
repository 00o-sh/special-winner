---
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-bucket-init
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: amazon/aws-cli:2.34.47@sha256:e899d2f3c2c86646a0b18cbd7a81feccf8eba2f177e2317059407368f51776d7
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: USTX01
          command:
            - /bin/sh
            - -c
            - |
              aws --endpoint-url http://garage.volsync-system.svc.cluster.local:3900 \
                s3api head-bucket --bucket mariadb-backups 2>/dev/null && \
                echo "Bucket mariadb-backups already exists" && exit 0
              aws --endpoint-url http://garage.volsync-system.svc.cluster.local:3900 \
                s3 mb s3://mariadb-backups && \
                echo "Bucket mariadb-backups created successfully"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
