---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: altinity-clickhouse-operator
spec:
  interval: 1h
  chart:
    spec:
      # renovate: datasource=helm depName=altinity-clickhouse-operator
      chart: altinity-clickhouse-operator
      version: 0.27.0
      sourceRef:
        kind: HelmRepository
        name: altinity-clickhouse-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    crdHook:
      enabled: true
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
