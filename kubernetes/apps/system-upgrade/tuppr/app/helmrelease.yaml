---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    # HA: one replica per node so an in-progress Talos upgrade can't
    # cripple the controller's quorum. Leader-election survives a
    # single-node disruption (this is what bit us on 2026-05-16).
    replicaCount: 3
    monitoring:
      serviceMonitor:
        enabled: true