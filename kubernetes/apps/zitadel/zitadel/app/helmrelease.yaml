---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  chart:
    spec:
      chart: zitadel
      version: 9.28.0
      sourceRef:
        kind: HelmRepository
        name: zitadel
  interval: 1h
  values:
    replicaCount: 1

    postgresql:
      enabled: false

    zitadel:
      masterkeySecretName: zitadel-secret
      configSecretName: zitadel-secret
      configSecretKey: config-yaml

      configmapConfig:
        ExternalDomain: login.00o.sh
        ExternalSecure: true
        ExternalPort: 443
        TLS:
          Enabled: false
        FirstInstance:
          Org:
            LoginClient:
              Machine:
                Username: login-client
                Name: Login Client
              Pat:
                ExpirationDate: "2029-01-01T00:00:00Z"

    initJob:
      enabled: true

    gateway:
      httpRoute:
        enabled: true
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        hostnames:
          - login.00o.sh

    login:
      enabled: true
      replicaCount: 1
      gateway:
        httpRoute:
          enabled: true
          parentRefs:
            - name: envoy-external
              namespace: network
              sectionName: https
          hostnames:
            - login.00o.sh
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
