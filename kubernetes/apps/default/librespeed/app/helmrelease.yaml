---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
spec:
  chartRef:
    kind: OCIRepository
    name: librespeed
  interval: 1h
  values:
    controllers:
      speed-cf:
        strategy: RollingUpdate
        containers:
          app:
            image: &image
              repository: ghcr.io/librespeed/speedtest
              tag: 5.5.1
            env: &env
              MODE: backend
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /empty.php
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"], add: ["CHOWN"] }
            resources: &resources
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
      speed-direct:
        strategy: RollingUpdate
        containers:
          app:
            image: *image
            env: *env
            probes:
              liveness: *probes
              readiness: *probes
            securityContext: *securityContext
            resources: *resources
      speed-portfwd:
        strategy: RollingUpdate
        containers:
          app:
            image: *image
            env: *env
            probes:
              liveness: *probes
              readiness: *probes
            securityContext: *securityContext
            resources: *resources
      speed-lan:
        strategy: RollingUpdate
        containers:
          app:
            image: *image
            env: *env
            command: ["bash", "-c", "a2enmod ssl && exec bash /entrypoint.sh"]
            probes:
              liveness: &lan-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /empty.php
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *lan-probes
            securityContext: *securityContext
            resources: *resources
      speed-frontend:
        strategy: RollingUpdate
        containers:
          app:
            image: *image
            env:
              MODE: frontend
            probes:
              liveness: &frontend-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *frontend-probes
            securityContext: *securityContext
            resources: *resources
    service:
      speed-cf:
        controller: speed-cf
        ports:
          http:
            port: *port
      speed-direct:
        controller: speed-direct
        ports:
          http:
            port: *port
      speed-portfwd:
        controller: speed-portfwd
        ports:
          http:
            port: *port
      speed-lan:
        type: LoadBalancer
        controller: speed-lan
        annotations:
          external-dns.alpha.kubernetes.io/hostname: speed-lan.${SECRET_DOMAIN}
          lbipam.cilium.io/ips: "10.0.6.16"
        ports:
          https:
            port: 443
            targetPort: 8443
      speed-frontend:
        controller: speed-frontend
        ports:
          http:
            port: *port
    configMaps:
      ssl-config:
        data:
          ssl-speedtest.conf: |-
            Listen 8443
            <VirtualHost *:8443>
              SSLEngine on
              SSLCertificateFile /etc/ssl/speedtest/tls.crt
              SSLCertificateKeyFile /etc/ssl/speedtest/tls.key
              DocumentRoot /var/www/html
            </VirtualHost>
      servers:
        data:
          servers.json: |-
            [
              {"name": "Cloudflare", "server": "//speed-cf.${SECRET_DOMAIN}/", "dlURL": "garbage.php", "ulURL": "empty.php", "pingURL": "empty.php", "getIpURL": "getIP.php"},
              {"name": "Port Forwarded", "server": "//speed-portfwd.${SECRET_DOMAIN}/", "dlURL": "garbage.php", "ulURL": "empty.php", "pingURL": "empty.php", "getIpURL": "getIP.php"},
              {"name": "Direct (Envoy)", "server": "//speed-direct.${SECRET_DOMAIN}/", "dlURL": "garbage.php", "ulURL": "empty.php", "pingURL": "empty.php", "getIpURL": "getIP.php"},
              {"name": "LAN Direct", "server": "//speed-lan.${SECRET_DOMAIN}/", "dlURL": "garbage.php", "ulURL": "empty.php", "pingURL": "empty.php", "getIpURL": "getIP.php"}
            ]
    persistence:
      servers:
        type: configMap
        identifier: servers
        advancedMounts:
          speed-frontend:
            app:
              - path: /servers.json
                subPath: servers.json
      ssl-config:
        type: configMap
        identifier: ssl-config
        advancedMounts:
          speed-lan:
            app:
              - path: /etc/apache2/sites-enabled/ssl-speedtest.conf
                subPath: ssl-speedtest.conf
      ssl-cert:
        type: secret
        name: speed-lan-tls
        advancedMounts:
          speed-lan:
            app:
              - path: /etc/ssl/speedtest
    route:
      speed-cf:
        hostnames: ["speed-cf.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: speed-cf
                port: *port
      speed-direct:
        hostnames: ["speed-direct.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: speed-direct
                port: *port
      speed-portfwd:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        hostnames: ["speed-portfwd.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: speed-portfwd
                port: *port
      speed-frontend:
        hostnames: ["speed.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: speed-frontend
                port: *port
