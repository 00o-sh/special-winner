---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: radarr
spec:
  kanidmRef:
    name: kanidm
  displayname: Radarr
  origin: "https://radarr.00o.sh"
  allowInsecureClientDisablePkce: true
  redirectUrl:
    - "https://radarr.00o.sh/oauth2/callback"
  scopeMap:
    - group: radarr-users
      scopes:
        - openid
        - email
        - profile
