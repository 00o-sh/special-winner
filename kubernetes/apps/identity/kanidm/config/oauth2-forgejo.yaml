---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: forgejo
spec:
  kanidmRef:
    name: kanidm
  displayname: Forgejo
  origin: "https://git.00o.sh"
  allowInsecureClientDisablePkce: true
  redirectUrl:
    - "https://git.00o.sh/user/oauth2/OIDC/callback"
  scopeMap:
    - group: forgejo-users
      scopes:
        - openid
        - email
        - profile
