---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: grafana
spec:
  kanidmRef:
    name: kanidm
  displayname: Grafana
  origin: "https://grafana.00o.sh"
  allowInsecureClientDisablePkce: true
  redirectUrl:
    - "https://grafana.00o.sh/oauth2/callback"
  scopeMap:
    - group: grafana-users
      scopes:
        - openid
        - email
        - profile
