---
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  # renovate: datasource=docker depName=docker.io/kanidm/server
  image: docker.io/kanidm/server:1.8.5
  domain: auth.${SECRET_DOMAIN}
  replicaGroups:
    - name: default
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
  tlsSecretName: kanidm-tls
  ldapPortName: ldaps
  env:
    - name: KANIDM_TRUST_X_FORWARD_FOR
      value: "true"
    - name: KANIDM_ONLINE_BACKUP_PATH
      value: /data/backups/
    - name: KANIDM_ONLINE_BACKUP_SCHEDULE
      value: "00 02 * * *"
    - name: KANIDM_ONLINE_BACKUP_VERSIONS
      value: "7"
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: openebs-hostpath
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: tools
      image: docker.io/kanidm/tools:1.8.5
      command: ["sleep", "infinity"]
      env:
        - name: KANIDM_URL
          value: https://localhost:8443
        - name: KANIDM_ACCEPT_INVALID_CERTS
          value: "true"
      resources:
        requests:
          cpu: 1m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tools-cache
          mountPath: /.cache
    - name: backup-sync
      # renovate: datasource=docker depName=amazon/aws-cli
      image: amazon/aws-cli:2.33.17
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            sleep 3600
            if [ -d "/data/backups" ]; then
              aws --endpoint-url "$S3_ENDPOINT" s3 sync /data/backups/ s3://kanidm/backups/
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) backup sync completed"
            fi
          done
      env:
        - name: S3_ENDPOINT
          value: http://garage.volsync-system.svc.cluster.local:3900
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: kanidm-s3-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: kanidm-s3-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: eu-west-1
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: kanidm-data
          mountPath: /data
          readOnly: true
  volumes:
    - name: tools-cache
      emptyDir: {}
