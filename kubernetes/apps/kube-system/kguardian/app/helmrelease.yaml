---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  values:
    # Controller: eBPF-based runtime observer (DaemonSet)
    # Runs in observe-only / audit mode - collects data but does NOT
    # auto-apply any NetworkPolicies or seccomp profiles.
    controller:
      excludedNamespaces:
        - kube-system
        - flux-system
      ignoreDaemonSet: true

    # Broker: intermediary service for controller data
    broker:
      replicas: 1

    # Frontend: web UI for visualizing observed traffic and generated policies
    frontend:
      replicas: 1
      ingress:
        enabled: false

    # Disable internal database - using existing CloudNative-PG postgres cluster
    database:
      replicas: 0

    # Optional AI features - disabled for audit-only deployment
    llmBridge:
      enabled: false
    mcpServer:
      enabled: false
  patches:
    - target:
        kind: Deployment
        name: kguardian-broker
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/env
          value:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kguardian-secret
                  key: DATABASE_URL
        - op: add
          path: /spec/template/spec/initContainers
          value:
            - name: init-db
              image: ghcr.io/home-operations/postgres-init:18@sha256:3c54d39f19fdb82ed5b3f286450e4071133cc6025bd0e25856bc2c522f8fc030
              envFrom:
                - secretRef:
                    name: kguardian-secret
    - target:
        kind: Deployment
        name: kguardian-database
      patch: |
        - op: replace
          path: /spec/replicas
          value: 0
