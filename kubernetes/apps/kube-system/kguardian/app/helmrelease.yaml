---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    broker:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/broker
        tag: v1.9.1@sha256:65261cdfa672c7ad61044e4fe58d945cc5b422dd64de6341aa23c46fd555570e
    controller:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/controller
        tag: v1.8.2
      initContainer:
        image:
          repository: busybox
          tag: stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      excludedNamespaces:
        - kube-system
    database:
      image:
        repository: postgres
        tag: 18-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    frontend:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/frontend
        tag: v1.9.0@sha256:32bb6300f51f0bdc3040d6bfa524c8ad56ecd27feb76fb28f9e46dcda7eede83
    llmBridge:
      enabled: false
    mcpServer:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          # Chart 1.11.1 emits the kguardian-db PVC without a storageClassName,
          # which doesn't bind because we have no cluster-default StorageClass.
          - target:
              kind: PersistentVolumeClaim
              name: kguardian-db-data
            patch: |
              - op: add
                path: /spec/storageClassName
                value: openebs-hostpath
          - target:
              kind: Deployment
              name: kguardian-broker
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/env
                value:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: kguardian-secret
                        key: DATABASE_URL
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: init-db
                    image: ghcr.io/home-operations/postgres-init:18@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
                    envFrom:
                      - secretRef:
                          name: kguardian-secret
          - target:
              kind: DaemonSet
              name: kguardian-controller
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kguardian-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: controller
                        env:
                          - name: RUST_LOG
                            value: "kguardian::pod_reconciler=debug,kguardian=info"
          - target:
              kind: Deployment
              name: kguardian-database
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
