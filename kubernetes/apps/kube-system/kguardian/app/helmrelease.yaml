---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    broker:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/broker
        tag: v1.18.2@sha256:2b19ea81767bf51afd52149fdb397dfd696ad7c2bc51761ccc658a3a94cf2c31
    controller:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/controller
        tag: v1.15.1
      initContainer:
        image:
          repository: busybox
          tag: stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      excludedNamespaces:
        - kube-system
    database:
      image:
        repository: postgres
        tag: 18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    frontend:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/frontend
        tag: v1.19.0@sha256:05bdcf4425f0d3ab6a7e03e84a456082c22a754a500a36c144e41bda6e6aab92
    llmBridge:
      enabled: false
    mcpServer:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          # Chart 1.11.1 emits the kguardian-db PVC without a storageClassName,
          # which doesn't bind because we have no cluster-default StorageClass.
          - target:
              kind: PersistentVolumeClaim
              name: kguardian-db-data
            patch: |
              - op: add
                path: /spec/storageClassName
                value: openebs-hostpath
          - target:
              kind: Deployment
              name: kguardian-broker
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/env
                value:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: kguardian-secret
                        key: DATABASE_URL
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: init-db
                    image: ghcr.io/home-operations/postgres-init:18@sha256:5086f94abc783f1147d7c2a32c01db00ab594820026e4f6a82ac2af3dbde7fc7
                    envFrom:
                      - secretRef:
                          name: kguardian-secret
          - target:
              kind: DaemonSet
              name: kguardian-controller
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kguardian-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: controller
                        env:
                          - name: RUST_LOG
                            value: "kguardian::pod_reconciler=debug,kguardian=info"
          - target:
              kind: Deployment
              name: kguardian-database
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
