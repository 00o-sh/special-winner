---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  values:
    broker:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/broker
        tag: v1.6.0
    controller:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/controller
        tag: v1.7.0
      initContainer:
        image:
          repository: busybox
          tag: stable@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
      excludedNamespaces:
        - kube-system
    database:
      image:
        repository: postgres
        tag: 18-alpine@sha256:88f300be8635fe8a9ed4c18a68ba497fb6df1215fd2b074895afd027bd3e1006
    frontend:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/frontend
        tag: v1.6.2
    llmBridge:
      enabled: false
    mcpServer:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kguardian-broker
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/env
                value:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: kguardian-secret
                        key: DATABASE_URL
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: init-db
                    image: ghcr.io/home-operations/postgres-init:18@sha256:ae89578925b480f5972f237dda2f7a37efe36aff500d3e7bd1d3a6a3181e4191
                    envFrom:
                      - secretRef:
                          name: kguardian-secret
          - target:
              kind: Deployment
              name: kguardian-database
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
