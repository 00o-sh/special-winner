---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  values:
    broker:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/broker
        tag: v1.6.1@sha256:9aeb2e3fe5a9255856105b0e0d6ce0e517e896a8fb635fa85af06b34dad0363b
    controller:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/controller
        tag: v1.7.0
      initContainer:
        image:
          repository: busybox
          tag: stable@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
      excludedNamespaces:
        - kube-system
    database:
      image:
        repository: postgres
        tag: 18-alpine@sha256:035b9ab53cfa147d7202b61f5f7782b939ae815b7d6bc81c96b7b42ff1fca950
    frontend:
      image:
        repository: ghcr.io/kguardian-dev/kguardian/frontend
        tag: v1.7.0@sha256:64aceca4cc8dc5714f9e9c491a96c7a22f164013fbc7b6137e1ca6bc2c41afcf
    llmBridge:
      enabled: false
    mcpServer:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kguardian-broker
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/env
                value:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: kguardian-secret
                        key: DATABASE_URL
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: init-db
                    image: ghcr.io/home-operations/postgres-init:18@sha256:ae89578925b480f5972f237dda2f7a37efe36aff500d3e7bd1d3a6a3181e4191
                    envFrom:
                      - secretRef:
                          name: kguardian-secret
          - target:
              kind: Deployment
              name: kguardian-database
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
