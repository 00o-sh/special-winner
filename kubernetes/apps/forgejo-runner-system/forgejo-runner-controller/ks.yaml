---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner-controller
spec:
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: keda
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/forgejo-runner-system/forgejo-runner-controller/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: forgejo-runner-controller-secret
        optional: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo-runner-system
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner-controller-runners
spec:
  dependsOn:
    - name: forgejo-runner-controller
    - name: external-secrets
      namespace: external-secrets
    - name: keda
      namespace: observability
    - name: openebs
      namespace: openebs-system
  interval: 1h
  path: ./kubernetes/apps/forgejo-runner-system/forgejo-runner-controller/runners
  postBuild:
    substituteFrom:
      - kind: Secret
        name: forgejo-runner-controller-secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo-runner-system
  wait: false
