---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chartRef:
    kind: OCIRepository
    name: openebs
  interval: 1h
  values:
    preUpgradeHook:
      enabled: false
    localpv-provisioner:
      analytics:
        enabled: false
      localpv:
        image:
          registry: quay.io/
        # New PVCs land on whichever node openebs-hostpath schedules them to,
        # using this basePath. On singlenodemaster the UserVolumeConfig at
        # talos/patches/singlenodemaster/user-volume-nvme.yaml mounts the
        # 512GB NVMe SSD here; on node-01/node-02 it's just a directory on
        # the system disk (their disks have plenty of free space).
        # Existing PVs reference their original absolute path, so this change
        # only affects newly-provisioned PVCs going forward.
        basePath: &hostPath /var/mnt/nvme-data
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false
        basePath: *hostPath
      helperPod:
        image:
          registry: quay.io/
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false
    zfs-localpv:
      enabled: false
    lvm-localpv:
      enabled: false
    mayastor:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    minio:
      enabled: false