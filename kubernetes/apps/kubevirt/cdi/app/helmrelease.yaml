---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cdi
spec:
  chart:
    spec:
      chart: cdi
      version: 1.61.2
      sourceRef:
        kind: HelmRepository
        name: encircle360-oss
        namespace: kubevirt
  interval: 1h
  values:
    operator:
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 512Mi
    cdi:
      spec:
        config:
          uploadProxyURLOverride: ""
          scratchSpaceStorageClass: ""
          filesystemOverhead:
            global: "0.055"
