---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-server
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ubuntu-server.00o.sh
spec:
  clusterIP: None
  ports:
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ubuntu-server
  labels:
    kubernetes.io/service-name: ubuntu-server
addressType: IPv4
ports:
  - name: ssh
    port: 22
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.57.10
