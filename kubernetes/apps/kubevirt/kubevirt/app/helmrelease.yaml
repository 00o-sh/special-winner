---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubevirt
spec:
  chart:
    spec:
      chart: kubevirt
      version: 1.6.2
      sourceRef:
        kind: HelmRepository
        name: encircle360-oss
  interval: 1h
  values:
    operator:
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 512Mi
    kubevirt:
      spec:
        configuration:
          developerConfiguration:
            featureGates:
              - LiveMigration
              - Macvtap
              - HotplugVolumes
              - HostDevices
              - GPU
          network:
            permitBridgeInterfaceOnPodNetwork: true
