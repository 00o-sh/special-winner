---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - Macvtap
        - HotplugVolumes
        - HostDevices
        - GPU
        - NetworkBindingPlugins
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
    network:
      permitBridgeInterfaceOnPodNetwork: true
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
