---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - Macvtap
        - HotplugVolumes
        - HostDevices
        - GPU
        - NetworkBindingPlugins
    network:
      permitBridgeInterfaceOnPodNetwork: true
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
