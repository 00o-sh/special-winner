---
# Headless service for external-dns registration only.
# Port definition is required by Kubernetes but has no effect -
# VM uses macvtap for direct L2 network access, all ports are allowed.
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-server
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ubuntu-server.00o.sh
    external-dns.alpha.kubernetes.io/target: 192.168.57.10
spec:
  clusterIP: None
  ports:
    - name: placeholder
      port: 1
