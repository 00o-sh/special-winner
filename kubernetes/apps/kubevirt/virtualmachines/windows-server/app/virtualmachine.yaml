---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: &name windows-server
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: *name
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "vm-macvtap",
            "namespace": "network",
            "mac": "52:54:00:57:00:20"
          }]
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 2G
        features:
          acpi: {}
          apic: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: sata
            - name: installiso
              bootOrder: 69
              cdrom:
                bus: sata
            - name: virtio-drivers
              cdrom:
                bus: sata
          interfaces:
            - name: lan
              binding:
                name: macvtap
      networks:
        - name: lan
          multus:
            networkName: network/vm-macvtap
      volumes:
        - name: rootdisk
          dataVolume:
            name: windows-server-pvc
        - name: installiso
          containerDisk:
            # renovate: datasource=docker depName=ghcr.io/00o-sh/windows-server
            image: ghcr.io/00o-sh/windows-server:2022-np@sha256:a58fc901489c01315da03d76c16138ebc7e8dc09704b89d75f515d8e3d74e5aa
        - name: virtio-drivers
          containerDisk:
            # renovate: datasource=docker depName=ghcr.io/00o-sh/windows-drivers
            image: ghcr.io/00o-sh/windows-drivers:server@sha256:60baa212536bf8767b7cbc0047ada2300eb0ab300c0a6d1f2173bd61544f9aed
  dataVolumeTemplates:
    - metadata:
        name: windows-server-pvc
      spec:
        storage:
          resources:
            requests:
              storage: 60Gi
          accessModes:
            - ReadWriteMany
          storageClassName: nfs-fast
        source:
          blank: {}
