---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubevirt-manager
spec:
  chartRef:
    kind: OCIRepository
    name: kubevirt-manager
  interval: 1h
  values:
    controllers:
      kubevirt-manager:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: kubevirtmanager/kubevirt-manager
              tag: 1.5.4
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 30000
            fsGroup: 30000
    serviceAccount:
      kubevirt-manager: {}
    service:
      app:
        controller: kubevirt-manager
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: KubeVirt Manager
          gethomepage.dev/icon: mdi-monitor
          gethomepage.dev/description: Virtual Machines
          gethomepage.dev/href: "https://kubevirt.00o.sh"
        hostnames:
          - kubevirt.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          kubevirt-manager:
            app:
              - path: /var/cache/nginx
      run:
        type: emptyDir
        advancedMounts:
          kubevirt-manager:
            app:
              - path: /var/run
