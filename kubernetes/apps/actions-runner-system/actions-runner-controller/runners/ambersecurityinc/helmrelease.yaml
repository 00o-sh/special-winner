---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name ambersecurityinc-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/ambersecurityinc
    githubConfigSecret: ambersecurityinc-runner-secret
    minRunners: 1
    maxRunners: 5
    listenerMetrics:
      counters:
        gha_started_jobs_total:
          labels:
            - repository
            - organization
            - job_name
            - event_name
        gha_completed_jobs_total:
          labels:
            - repository
            - organization
            - job_name
            - event_name
            - job_result
      gauges:
        gha_assigned_jobs:
          labels:
            - name
            - namespace
            - repository
            - organization
        gha_running_jobs:
          labels:
            - name
            - namespace
            - repository
            - organization
        gha_registered_runners:
          labels:
            - name
            - namespace
            - repository
            - organization
        gha_busy_runners:
          labels:
            - name
            - namespace
            - repository
            - organization
        gha_min_runners:
          labels:
            - name
            - namespace
        gha_max_runners:
          labels:
            - name
            - namespace
        gha_desired_runners:
          labels:
            - name
            - namespace
        gha_idle_runners:
          labels:
            - name
            - namespace
      histograms:
        gha_job_startup_duration_seconds:
          labels:
            - repository
            - organization
            - job_name
            - event_name
        gha_job_execution_duration_seconds:
          labels:
            - repository
            - organization
            - job_name
            - event_name
            - job_result
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 25Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.333.1@sha256:1a7726bcaeba4e46fe07fe98e1805b4df78618a71e67758f932862b929f852d4
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
        serviceAccountName: *name
        volumes:
          - name: talos
            secret:
              secretName: *name
