---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freepbx-b1-k3s01
spec:
  chartRef:
    kind: OCIRepository
    name: freepbx-b1-k3s01
  interval: 1h
  values:
    controllers:
      freepbx-b1-k3s01:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/00o-sh/fpbx-docker
              tag: 17@sha256:af807d6280773a37584c35b4118f1c14056b4e457b7f739cb4e0b3d772dfb4c8
            env:
              DB_HOST: mariadb-primary.database.svc.cluster.local
              DB_PORT: "3306"
              DB_USER: freepbx_b1
              DB_NAME: b1_asterisk
              DB_CDR_NAME: b1_asteriskcdrdb
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: freepbx-b1-k3s01-secret
                    key: DB_PASS
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 520
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 520
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: freepbx-b1-k3s01
        ports:
          http:
            port: 80
          https:
            port: 443
          ucp:
            port: 8001
          admin:
            port: 8003

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: VoIP
          gethomepage.dev/name: FreePBX B1
          gethomepage.dev/icon: freepbx.png
          gethomepage.dev/description: Telephony Platform
          gethomepage.dev/href: "https://freepbx-b1-k3s01.00o.sh"
        hostnames:
          - freepbx-b1-k3s01.00o.sh
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    persistence:
      asterisk-etc:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        advancedMounts:
          freepbx-b1-k3s01:
            app:
              - path: /etc/asterisk
      asterisk-lib:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        advancedMounts:
          freepbx-b1-k3s01:
            app:
              - path: /var/lib/asterisk
      asterisk-spool:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        advancedMounts:
          freepbx-b1-k3s01:
            app:
              - path: /var/spool/asterisk
      asterisk-log:
        type: emptyDir
        advancedMounts:
          freepbx-b1-k3s01:
            app:
              - path: /var/log/asterisk
