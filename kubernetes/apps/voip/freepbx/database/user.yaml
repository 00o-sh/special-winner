---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: freepbx
spec:
  mariaDbRef:
    name: mariadb
  name: freepbx
  passwordSecretKeyRef:
    name: freepbx-db-secret
    key: password
  maxUserConnections: 100
  host: "%"
  cleanupPolicy: Skip
  requeueInterval: 30s
  retryInterval: 5s
