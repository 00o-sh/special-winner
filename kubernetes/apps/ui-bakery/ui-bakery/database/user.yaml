---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: ui-bakery
spec:
  mariaDbRef:
    name: mariadb
  name: bakery
  passwordSecretKeyRef:
    name: ui-bakery-db-secret
    key: password
  maxUserConnections: 100
  host: "%"
  cleanupPolicy: Skip
  requeueInterval: 30s
  retryInterval: 5s
