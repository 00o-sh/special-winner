---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: ui-bakery
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: bakery
  table: "*"
  username: bakery
  host: "%"
  grantOption: false
  cleanupPolicy: Skip
  requeueInterval: 30s
  retryInterval: 5s
