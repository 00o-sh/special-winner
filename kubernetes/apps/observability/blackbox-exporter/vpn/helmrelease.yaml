---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-vpn
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-vpn
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-vpn
    strategy:
      type: Recreate
    # Pin to singlenodemaster: macvlan frames are dropped by the
    # Proxmox VM nodes (node-01-pve / node-02-pve). Remove once
    # the Proxmox bridge is configured to forward unknown source
    # MACs from the VMs.
    nodeSelector:
      kubernetes.io/hostname: singlenodemaster
    podAnnotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "vpn",
            "namespace": "network",
            "ips": ["192.168.56.253/24"],
            "mac": "32:0b:d8:1f:b6:e5"
          }]
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: VpnProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-vpn"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: blackbox-exporter-vpn
            patch: |-
              - op: remove
                path: /spec/strategy/rollingUpdate
