---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
spec:
  chartRef:
    kind: OCIRepository
    name: teslamate
  interval: 1h
  values:
    controllers:
      teslamate:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
            envFrom:
              - secretRef:
                  name: teslamate-secret
          init-extensions:
            # TeslaMate's geo migrations install cube/earthdistance
            # (superuser-only) and then run ALTER EXTENSION / ALTER FUNCTION
            # on them, which require the migration role to be the extension
            # owner. PostgreSQL has no `ALTER EXTENSION ... OWNER TO`
            # syntax - extensions inherit ownership from the role that ran
            # CREATE EXTENSION (postgres, in our case) and there's no way
            # to reassign it after the fact.
            #
            # The supported workaround is role membership: GRANT postgres
            # TO teslamate makes the app role inherit postgres's ownership
            # for permission checks, so the migration's ALTER EXTENSION /
            # ALTER FUNCTION calls succeed without us needing to chase
            # individual member objects (functions, types, operators, ...).
            # Acceptable in this single-tenant homelab cluster.
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
            command:
              - /bin/sh
              - -c
              - |
                PGPASSWORD="$INIT_POSTGRES_SUPER_PASS" psql \
                  -h "$INIT_POSTGRES_HOST" \
                  -p "$INIT_POSTGRES_PORT" \
                  -U postgres \
                  -d "$INIT_POSTGRES_DBNAME" \
                  -v ON_ERROR_STOP=1 \
                  -v app_user="$INIT_POSTGRES_USER" <<'SQL'
                CREATE EXTENSION IF NOT EXISTS cube;
                CREATE EXTENSION IF NOT EXISTS earthdistance;

                GRANT postgres TO :"app_user";
                SQL
            envFrom:
              - secretRef:
                  name: teslamate-secret
        containers:
          app:
            image:
              repository: docker.io/teslamate/teslamate
              tag: 1.32.0@sha256:8c282ada5c72b7b0cbd316ec7bc010a9214d5943cf1e1b36ab9b7a98f45a5809
            env:
              TZ: America/New_York
              VIRTUAL_HOST: teslamate.00o.sh
              CHECK_ORIGIN: "true"
              PORT: &port 4000
              DISABLE_MQTT: "true"
              DATABASE_HOST: postgres-rw.database.svc.cluster.local
              DATABASE_PORT: "5432"
              DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: INIT_POSTGRES_DBNAME
              DATABASE_USER:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: INIT_POSTGRES_USER
              DATABASE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: INIT_POSTGRES_PASS
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: ENCRYPTION_KEY
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: teslamate
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: TeslaMate
          gethomepage.dev/icon: teslamate.png
          gethomepage.dev/description: Tesla Data Logger
          gethomepage.dev/href: "https://teslamate.00o.sh"
        hostnames:
          - teslamate.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          teslamate:
            app:
              - path: /tmp
