---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
spec:
  chartRef:
    kind: OCIRepository
    name: teslamate
  interval: 1h
  values:
    controllers:
      teslamate:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
            envFrom:
              - secretRef:
                  name: teslamate-secret
          init-extensions:
            # TeslaMate's CreateGeoExtensions migration installs cube /
            # earthdistance (superuser-only) and then runs ALTER FUNCTION on
            # the geo helpers (owner-only). Later migrations may ALTER
            # EXTENSION (e.g. UPDATE) which also requires owner. Install the
            # extensions as the postgres superuser, then hand the extensions
            # AND every member object (functions, types, operators, opclasses,
            # operator families) over to the teslamate role so the app role
            # can run any ALTER variant without tripping on ownership.
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
            command:
              - /bin/sh
              - -c
              - |
                PGPASSWORD="$INIT_POSTGRES_SUPER_PASS" psql \
                  -h "$INIT_POSTGRES_HOST" \
                  -p "$INIT_POSTGRES_PORT" \
                  -U postgres \
                  -d "$INIT_POSTGRES_DBNAME" \
                  -v ON_ERROR_STOP=1 \
                  -v app_user="$INIT_POSTGRES_USER" <<'SQL'
                CREATE EXTENSION IF NOT EXISTS cube;
                CREATE EXTENSION IF NOT EXISTS earthdistance;

                ALTER EXTENSION cube OWNER TO :"app_user";
                ALTER EXTENSION earthdistance OWNER TO :"app_user";

                -- Hand every extension member object (regardless of kind)
                -- to the app role. Walk pg_depend so future cube /
                -- earthdistance upgrades that add new objects keep working.
                SELECT 'ALTER FUNCTION ' || objid::regprocedure::text
                       || ' OWNER TO ' || quote_ident(:'app_user') || ';'
                FROM pg_depend
                WHERE classid    = 'pg_proc'::regclass
                  AND deptype    = 'e'
                  AND refclassid = 'pg_extension'::regclass
                  AND refobjid IN (SELECT oid FROM pg_extension
                                   WHERE extname IN ('cube','earthdistance'))
                UNION ALL
                SELECT 'ALTER TYPE ' || objid::regtype::text
                       || ' OWNER TO ' || quote_ident(:'app_user') || ';'
                FROM pg_depend
                WHERE classid    = 'pg_type'::regclass
                  AND deptype    = 'e'
                  AND refclassid = 'pg_extension'::regclass
                  AND refobjid IN (SELECT oid FROM pg_extension
                                   WHERE extname IN ('cube','earthdistance'))
                UNION ALL
                SELECT 'ALTER OPERATOR ' || objid::regoperator::text
                       || ' OWNER TO ' || quote_ident(:'app_user') || ';'
                FROM pg_depend
                WHERE classid    = 'pg_operator'::regclass
                  AND deptype    = 'e'
                  AND refclassid = 'pg_extension'::regclass
                  AND refobjid IN (SELECT oid FROM pg_extension
                                   WHERE extname IN ('cube','earthdistance'))
                UNION ALL
                SELECT 'ALTER OPERATOR CLASS ' || quote_ident(opc.opcname)
                       || ' USING ' || quote_ident(am.amname)
                       || ' OWNER TO ' || quote_ident(:'app_user') || ';'
                FROM pg_depend d
                JOIN pg_opclass opc ON opc.oid = d.objid
                JOIN pg_am am       ON am.oid  = opc.opcmethod
                WHERE d.classid    = 'pg_opclass'::regclass
                  AND d.deptype    = 'e'
                  AND d.refclassid = 'pg_extension'::regclass
                  AND d.refobjid IN (SELECT oid FROM pg_extension
                                     WHERE extname IN ('cube','earthdistance'))
                UNION ALL
                SELECT 'ALTER OPERATOR FAMILY ' || quote_ident(opf.opfname)
                       || ' USING ' || quote_ident(am.amname)
                       || ' OWNER TO ' || quote_ident(:'app_user') || ';'
                FROM pg_depend d
                JOIN pg_opfamily opf ON opf.oid = d.objid
                JOIN pg_am am        ON am.oid  = opf.opfmethod
                WHERE d.classid    = 'pg_opfamily'::regclass
                  AND d.deptype    = 'e'
                  AND d.refclassid = 'pg_extension'::regclass
                  AND d.refobjid IN (SELECT oid FROM pg_extension
                                     WHERE extname IN ('cube','earthdistance'))
                \gexec
                SQL
            envFrom:
              - secretRef:
                  name: teslamate-secret
        containers:
          app:
            image:
              repository: docker.io/teslamate/teslamate
              tag: 1.32.0@sha256:8c282ada5c72b7b0cbd316ec7bc010a9214d5943cf1e1b36ab9b7a98f45a5809
            env:
              TZ: America/New_York
              VIRTUAL_HOST: teslamate.00o.sh
              CHECK_ORIGIN: "true"
              PORT: &port 4000
              DISABLE_MQTT: "true"
              DATABASE_HOST: postgres-rw.database.svc.cluster.local
              DATABASE_PORT: "5432"
              DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: INIT_POSTGRES_DBNAME
              DATABASE_USER:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: INIT_POSTGRES_USER
              DATABASE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: INIT_POSTGRES_PASS
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-secret
                    key: ENCRYPTION_KEY
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: teslamate
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: TeslaMate
          gethomepage.dev/icon: teslamate.png
          gethomepage.dev/description: Tesla Data Logger
          gethomepage.dev/href: "https://teslamate.00o.sh"
        hostnames:
          - teslamate.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          teslamate:
            app:
              - path: /tmp
