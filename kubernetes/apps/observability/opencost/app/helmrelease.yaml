---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
spec:
  chart:
    spec:
      chart: opencost
      version: "2.5.8"
      sourceRef:
        kind: HelmRepository
        name: opencost
  interval: 1h
  values:
    opencost:
      exporter:
        defaultClusterId: special-winner
        resources:
          requests:
            cpu: 10m
            memory: 55Mi
          limits:
            memory: 256Mi
      prometheus:
        internal:
          enabled: true
          namespaceName: observability
          serviceName: prometheus-operated
          port: 9090
      ui:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 55Mi
          limits:
            memory: 128Mi
      customPricing:
        enabled: true
        provider: custom
        costModel:
          CPU: "28.0"
          spotCPU: "6.5"
          RAM: "3.09"
          spotRAM: "0.65"
          GPU: "693.50"
          storage: "0.04"
    serviceMonitor:
      enabled: true
