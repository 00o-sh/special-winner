---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    fullnameOverride: victoria-logs
    server:
      podSecurityContext:
        # Skip the recursive volume chown on every pod start - kubelet
        # only walks the volume when the root dir's owner doesn't match.
        # Without this, a chart upgrade that nudges fsGroup re-chowns
        # every file on the 20Gi NFS PVC and the pod sits in
        # "fixing permissions" for hours.
        fsGroupChangePolicy: OnRootMismatch
      persistentVolume:
        enabled: true
        storageClassName: nfs-fast
        size: 20Gi
      retentionPeriod: 14d
      route:
        enabled: true
        hostnames:
          - victoria-logs.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      service:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Monitoring
          gethomepage.dev/name: Victoria Logs
          gethomepage.dev/icon: mdi-math-log
          gethomepage.dev/description: Log Aggregation
          gethomepage.dev/href: "https://victoria-logs.00o.sh"
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
