---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: plane-secret
    template:
      engineVersion: v2
      data:
        # PostgreSQL init
        INIT_POSTGRES_DBNAME: "{{ .PLANE_POSTGRES_DB }}"
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "{{ .PLANE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .PLANE_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # Application
        DATABASE_URL: "postgresql://{{ .PLANE_POSTGRES_USER }}:{{ .PLANE_POSTGRES_PASSWORD }}@postgres-rw.database.svc.cluster.local:5432/{{ .PLANE_POSTGRES_DB }}"
        SECRET_KEY: "{{ .PLANE_SECRET_KEY }}"
        # S3 storage (Garage)
        AWS_ACCESS_KEY_ID: "{{ .PLANE_S3_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .PLANE_S3_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: plane
    - extract:
        key: cloudnative-pg
