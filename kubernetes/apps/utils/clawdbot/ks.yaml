---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clawdbot
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: litellm
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/utils/clawdbot/app
  postBuild:
    substitute:
      APP: clawdbot
      VOLSYNC_CAPACITY: 5Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: utils
  wait: false
