---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 1h
  values:
    defaultPodOptions:
      # app-template v5 doesn't auto-mount SA tokens by default. Pin true now
      # (no-op on v4) so homepage's K8s API client keeps working after the
      # chart bump. Backwards-compatible with v4.
      automountServiceAccountToken: true
    controllers:
      homepage:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/00o-sh/homepage
              # renovate: datasource=github-releases depName=00o-sh/homepage
              tag: v1.13.1
            env:
              HOMEPAGE_ALLOWED_HOSTS: homepage.00o.sh
              LOG_TARGETS: stdout
            envFrom:
              - secretRef:
                  name: homepage-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    httpHeaders:
                      - name: Host
                        value: homepage.00o.sh
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    serviceAccount:
      homepage: {}

    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [namespaces, pods, nodes, services]
              verbs: [get, list]
            - apiGroups: ["apps"]
              resources: [deployments, statefulsets, daemonsets]
              verbs: [get, list]
            - apiGroups: ["batch"]
              resources: [jobs, cronjobs]
              verbs: [get, list]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions/status]
              verbs: [get]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage

    service:
      app:
        controller: homepage
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - homepage.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    configMaps:
      config:
        data:
          kubernetes.yaml: |
            mode: cluster
            gateway: true
            ingress: false
            traefik: false
          docker.yaml: ""
          settings.yaml: |
            title: Home Operations
            favicon: https://kubernetes.io/images/favicon.png
            headerStyle: clean
            layout:
              Media:
                icon: mdi-play-circle
                style: row
                columns: 4
              Downloads:
                icon: mdi-download-circle
                style: row
                columns: 4
              Monitoring:
                icon: mdi-chart-line
                style: row
                columns: 4
              Infrastructure:
                icon: mdi-server
                style: row
                columns: 3
              Storage:
                icon: mdi-database
                style: row
                columns: 3
              Utilities:
                icon: mdi-tools
                style: row
                columns: 3
          widgets.yaml: |
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: cluster
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
            - search:
                provider: duckduckgo
                target: _blank
            - datetime:
                text_size: xl
                format:
                  dateStyle: long
                  timeStyle: short
                  hourCycle: h23
          services.yaml: ""
          bookmarks.yaml: |
            - Developer:
                - GitHub:
                    - icon: github.png
                      href: https://github.com/00o-sh/special-winner

    persistence:
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
          - path: /app/config/services.yaml
            subPath: services.yaml
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
          - path: /app/config/docker.yaml
            subPath: docker.yaml
