---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-secret
    template:
      engineVersion: v2
      data:
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HOMEPAGE_VAR_TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        HOMEPAGE_VAR_PLEX_TOKEN: "{{ .PLEX_TOKEN }}"
        HOMEPAGE_VAR_AUTOBRR_API_KEY: "{{ .AUTOBRR_API_KEY }}"
        HOMEPAGE_VAR_BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        # Server-access creds for the Kopia web UI widget (not the
        # repository encryption password .KOPIA_PASSWORD).
        HOMEPAGE_VAR_KOPIA_USERNAME: "{{ .KOPIA_SERVER_USERNAME }}"
        HOMEPAGE_VAR_KOPIA_PASSWORD: "{{ .KOPIA_SERVER_PASSWORD }}"
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: prowlarr
    - extract:
        key: seerr
    - extract:
        key: tautulli
    - extract:
        key: plex
    - extract:
        key: autobrr
    - extract:
        key: bazarr
    - extract:
        key: volsync-template
