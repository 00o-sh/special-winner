---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  chartRef:
    kind: OCIRepository
    name: n8n
  interval: 1h
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
            envFrom:
              - secretRef:
                  name: n8n-secret
        containers:
          app:
            image:
              repository: docker.n8n.io/n8nio/n8n
              tag: 2.12.2@sha256:1e764de257f2b1eb6fc0e2477bd82cf8f5de9e68b82ac243b1a2db1551426723
            env:
              GENERIC_TIMEZONE: America/New_York
              N8N_HOST: n8n.00o.sh
              N8N_PROTOCOL: https
              N8N_PORT: &port 5678
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
              DB_TYPE: postgresdb
              DB_POSTGRESDB_HOST: postgres-rw.database.svc.cluster.local
              DB_POSTGRESDB_PORT: "5432"
              DB_POSTGRESDB_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: INIT_POSTGRES_DBNAME
              DB_POSTGRESDB_USER:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: INIT_POSTGRES_USER
              DB_POSTGRESDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: INIT_POSTGRES_PASS
              N8N_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_ENCRYPTION_KEY
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console
              EXECUTIONS_DATA_PRUNE: "true"
              EXECUTIONS_DATA_MAX_AGE: "168"
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/name: n8n
          gethomepage.dev/icon: n8n.png
          gethomepage.dev/description: Workflow Automation
          gethomepage.dev/href: "https://n8n.00o.sh"
        hostnames:
          - n8n.00o.sh
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.cache
      data:
        type: emptyDir
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n
      tmp:
        type: emptyDir
        advancedMounts:
          n8n:
            app:
              - path: /tmp
