---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rustdesk
spec:
  chartRef:
    kind: OCIRepository
    name: rustdesk
  interval: 1h
  values:
    controllers:
      rustdesk:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          hbbs:
            image:
              repository: rustdesk/rustdesk-server
              tag: latest
            command: ["hbbs"]
            env:
              ENCRYPTED_ONLY: "1"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
          hbbr:
            image:
              repository: rustdesk/rustdesk-server
              tag: latest
            command: ["hbbr"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0

    service:
      app:
        controller: rustdesk
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: rustdesk.00o.sh
          lbipam.cilium.io/ips: 10.0.6.21
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/name: RustDesk
          gethomepage.dev/icon: rustdesk.png
          gethomepage.dev/description: Remote Desktop
        externalTrafficPolicy: Cluster
        ports:
          hbbs-nat:
            port: 21115
            protocol: TCP
          hbbs-tcp:
            port: 21116
            protocol: TCP
          hbbs-udp:
            port: 21116
            protocol: UDP
          hbbr:
            port: 21117
            protocol: TCP
          hbbs-ws:
            port: 21118
            protocol: TCP
          hbbr-ws:
            port: 21119
            protocol: TCP

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          rustdesk:
            hbbs:
              - path: /root
            hbbr:
              - path: /root
