---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    gitea:
      admin:
        existingSecret: &secret forgejo-secret
      config:
        database:
          DB_TYPE: postgres
          HOST: postgres-rw.database.svc.cluster.local:5432
        server:
          DOMAIN: git.00o.sh
          ROOT_URL: https://git.00o.sh
          SSH_DOMAIN: git.00o.sh
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
          LFS_START_SERVER: true
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DISABLE_REGISTRATION: false
          SHOW_REGISTRATION_BUTTON: false
        openid:
          ENABLE_OPENID_SIGNIN: true
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          OPENID_CONNECT_SCOPES: openid email profile
          USERNAME: preferred_username
        mailer:
          ENABLED: true
          PROTOCOL: smtp
          SMTP_ADDR: smtp-relay.utils.svc.cluster.local
          SMTP_PORT: 25
          FROM: "Forgejo <forgejo@00o.sh>"
      oauth:
        - name: OIDC
          provider: openidConnect
          existingSecret: *secret
          autoDiscoverUrl: https://auth.00o.sh/oauth2/openid/forgejo/.well-known/openid-configuration
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    postgresql:
      enabled: false
    memcached:
      enabled: false
    persistence:
      enabled: true
      mount: true
      create: false
      claimName: *app
    service:
      ssh:
        type: LoadBalancer
        port: 22
        annotations:
          external-dns.alpha.kubernetes.io/hostname: git.00o.sh
          lbipam.cilium.io/ips: 10.0.6.20
    httpRoute:
      enabled: true
      hostnames:
        - git.00o.sh
      parentRefs:
        - name: envoy-internal
          namespace: network
        - name: envoy-external
          namespace: network
          sectionName: https
  valuesFrom:
    - targetPath: gitea.config.database.NAME
      kind: Secret
      name: *secret
      valuesKey: POSTGRES_DB
    - targetPath: gitea.config.database.USER
      kind: Secret
      name: *secret
      valuesKey: POSTGRES_USERNAME
    - targetPath: gitea.config.database.PASSWD
      kind: Secret
      name: *secret
      valuesKey: POSTGRES_PASSWORD
    - targetPath: gitea.config.security.SECRET_KEY
      kind: Secret
      name: *secret
      valuesKey: FORGEJO_SECRET_KEY
    - targetPath: gitea.config.security.INTERNAL_TOKEN
      kind: Secret
      name: *secret
      valuesKey: FORGEJO_INTERNAL_TOKEN
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: forgejo
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: forgejo
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-db
                        image: ghcr.io/home-operations/postgres-init:18
                        envFrom:
                          - secretRef:
                              name: forgejo-secret
