---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot
spec:
  chartRef:
    kind: OCIRepository
    name: penpot
  interval: 1h
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:5086f94abc783f1147d7c2a32c01db00ab594820026e4f6a82ac2af3dbde7fc7
            envFrom:
              - secretRef:
                  name: penpot-secret
        containers:
          app:
            image:
              repository: penpotapp/backend
              tag: 2.17.2@sha256:770b55f6e51bfcee49152b30858ca6a47143256de8d43953a50b952b5c60bb55
            env:
              PENPOT_PUBLIC_URI: https://penpot.00o.sh
              PENPOT_FLAGS: enable-registration enable-login-with-password enable-login-with-oidc disable-email-verification
              PENPOT_OIDC_CLIENT_ID: penpot
              PENPOT_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: penpot-secret
                    key: PENPOT_OIDC_CLIENT_SECRET
              PENPOT_OIDC_BASE_URI: https://auth.00o.sh/oauth2/openid/penpot
              PENPOT_OIDC_AUTH_URI: https://auth.00o.sh/ui/oauth2
              PENPOT_OIDC_TOKEN_URI: https://auth.00o.sh/oauth2/token
              PENPOT_OIDC_USER_URI: https://auth.00o.sh/oauth2/openid/penpot/userinfo
              PENPOT_OIDC_SCOPES: "openid email profile"
              PENPOT_OIDC_NAME_ATTR: name
              PENPOT_OIDC_EMAIL_ATTR: email
              PENPOT_DATABASE_URI:
                valueFrom:
                  secretKeyRef:
                    name: penpot-secret
                    key: PENPOT_DATABASE_URI
              PENPOT_DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: penpot-secret
                    key: INIT_POSTGRES_USER
              PENPOT_DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: penpot-secret
                    key: INIT_POSTGRES_PASS
              PENPOT_REDIS_URI: redis://penpot-valkey:6379/0
              PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
              PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
              PENPOT_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: penpot-secret
                    key: PENPOT_SECRET_KEY
              PENPOT_TELEMETRY_ENABLED: "false"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 6060
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 6060
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

      frontend:
        containers:
          app:
            image:
              repository: penpotapp/frontend
              tag: 2.17.2@sha256:94fa2864d8fc0cd62245af95c03cca89306a7fd23c206a98a3e9dc9a376ea27e
            env:
              PENPOT_FLAGS: enable-registration enable-login-with-password enable-login-with-oidc disable-email-verification
              PENPOT_BACKEND_URI: http://penpot-backend:6060
              PENPOT_EXPORTER_URI: http://penpot-exporter:6061
            probes:
              liveness: &frontendProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness: *frontendProbes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

      exporter:
        containers:
          app:
            image:
              repository: penpotapp/exporter
              tag: 2.17.2@sha256:72a8061e88069b9baf0767bc11fbf3310d2527bb5964ca084cf8c844d84306c8
            env:
              PENPOT_PUBLIC_URI: https://penpot.00o.sh
              PENPOT_REDIS_URI: redis://penpot-valkey:6379/0
              PENPOT_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: penpot-secret
                    key: PENPOT_SECRET_KEY
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi

      valkey:
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 9.1.0-alpine
            args: ["--save", "60", "1"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      backend:
        controller: backend
        ports:
          http:
            port: 6060
      frontend:
        controller: frontend
        ports:
          http:
            port: 8080
      exporter:
        controller: exporter
        ports:
          http:
            port: 6061
      valkey:
        controller: valkey
        ports:
          redis:
            port: 6379

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/name: Penpot
          gethomepage.dev/icon: penpot.png
          gethomepage.dev/description: Design Platform
          gethomepage.dev/href: "https://penpot.00o.sh"
        hostnames:
          - penpot.00o.sh
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: frontend
                port: 8080

    persistence:
      assets:
        existingClaim: penpot
        advancedMounts:
          backend:
            app:
              - path: /opt/data/assets
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /data
