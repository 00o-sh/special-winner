---
# Local block-storage PVC for Garage's LMDB metadata.
# LMDB doesn't work on NFS (file-lock EAGAIN), so meta lives here.
# Off-node durability handled by the snapshot-rsync sidecar in the
# Garage HelmRelease, which copies /meta/snapshots/ to NFS daily.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  annotations:
    # Survive Flux SSA reconciliation from imperative changes (e.g., resize).
    kustomize.toolkit.fluxcd.io/ssa: merge
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: openebs-hostpath
