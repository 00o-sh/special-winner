---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage
spec:
  interval: 2h
  chartRef:
    kind: OCIRepository
    name: garage-app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Tell the VolSync Kopia mover to skip the live db.lmdb dir (its
          # lock.mdb is exclusively locked while Garage runs; we rely on
          # Garage's own /meta/snapshots/ for consistent LMDB backup points).
          write-kopiaignore:
            image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
            command: ["sh","-c","printf 'db.lmdb/\n' > /meta/.kopiaignore && chmod 0644 /meta/.kopiaignore"]
        containers:
          app:
            image:
              repository: dxflrs/garage
              tag: v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
            envFrom:
              - secretRef:
                  name: garage-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          api:
            port: &port 3903
          web:
            port: &webPort 3902
          s3:
            port: &s3Port 3900
    route:
      api:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Garage S3 API
            group: storage
            interval: 1m
            urlPath: /health
            conditions:
              - "[STATUS] >= 200 && [STATUS] < 405"
        hostnames:
          - garage-api.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
      s3:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Garage S3
            group: storage
            interval: 1m
            urlPath: /health
            conditions:
              - "[STATUS] >= 200 && [STATUS] < 405"
        hostnames:
          - garage-s3.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *s3Port
      web:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Garage Bucket Web Access
            group: storage
            interval: 1m
            urlPath: /
            conditions:
              - "[STATUS] >= 200 && [STATUS] < 405"
        hostnames:
          - garage-web.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *webPort
    persistence:
      config:
        enabled: true
        type: configMap
        name: garage
        globalMounts:
          - path: /etc/garage.toml
            subPath: configuration.toml
      data:
        type: nfs
        server: nas.3226texas.com
        path: /mnt/Speed/Kubernetes/apps/garage/data
        globalMounts:
          - path: /data
      meta:
        # LMDB requires real block storage for safe file locks (NFS causes
        # 'Resource temporarily unavailable' EAGAIN on every worker, leaving
        # Garage running but unable to read buckets/keys). Use a local PVC.
        # The PVC is backed up by VolSync to NFS for off-node durability.
        existingClaim: garage-meta
        globalMounts:
          - path: /meta