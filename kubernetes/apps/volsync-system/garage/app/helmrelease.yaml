---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage
spec:
  interval: 2h
  chartRef:
    kind: OCIRepository
    name: garage-app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: dxflrs/garage
              tag: v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
            envFrom:
              - secretRef:
                  name: garage-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
          # Off-node durability for Garage's LMDB meta. Garage's own
          # /meta/snapshots/ is consistent (mdb_env_copy()'d); we ship those
          # plus the small config files to NFS daily. On node loss, the
          # restore Job in scripts/volsync-restore-all.sh wipes the PVC and
          # repopulates from this NFS path.
          backup-sync:
            image:
              repository: alpine
              tag: "3"
            command: ["sh", "-c"]
            args:
              - |
                apk add --no-cache rsync >/dev/null
                while true; do
                  echo "[$(date -Iseconds)] meta-backup sync starting"
                  rsync -rt --delete --exclude='db.lmdb' /meta/ /backup/ \
                    && echo "[$(date -Iseconds)] meta-backup sync ok" \
                    || echo "[$(date -Iseconds)] meta-backup sync FAILED"
                  sleep 86400
                done
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          api:
            port: &port 3903
          web:
            port: &webPort 3902
          s3:
            port: &s3Port 3900
    route:
      api:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Garage S3 API
            group: storage
            interval: 1m
            urlPath: /health
            conditions:
              - "[STATUS] >= 200 && [STATUS] < 405"
        hostnames:
          - garage-api.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
      s3:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Garage S3
            group: storage
            interval: 1m
            urlPath: /health
            conditions:
              - "[STATUS] >= 200 && [STATUS] < 405"
        hostnames:
          - garage-s3.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *s3Port
      web:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Garage Bucket Web Access
            group: storage
            interval: 1m
            urlPath: /
            conditions:
              - "[STATUS] >= 200 && [STATUS] < 405"
        hostnames:
          - garage-web.00o.sh
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *webPort
    persistence:
      config:
        enabled: true
        type: configMap
        name: garage
        globalMounts:
          - path: /etc/garage.toml
            subPath: configuration.toml
      data:
        type: nfs
        server: nas.3226texas.com
        path: /mnt/Speed/Kubernetes/apps/garage/data
        globalMounts:
          - path: /data
      meta:
        # LMDB requires real block storage for safe file locks (NFS causes
        # 'Resource temporarily unavailable' EAGAIN on every worker, leaving
        # Garage running but unable to read buckets/keys). Use a local PVC.
        # Off-node durability is the backup-sync sidecar which rsyncs
        # /meta/ (minus db.lmdb live dir) to /backup/ (NFS) every 24h.
        existingClaim: garage-meta
        globalMounts:
          - path: /meta
      meta-backup:
        type: nfs
        server: nas.3226texas.com
        path: /mnt/Speed/Kubernetes/apps/garage/meta-backup
        advancedMounts:
          garage:
            backup-sync:
              - path: /backup