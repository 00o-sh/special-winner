---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage
spec:
  groups:
    - name: garage.rules
      rules:
        # The backup-sync sidecar exits non-zero on rsync failure or timeout.
        # Kubernetes restarts the container, which bumps this counter.
        # A healthy sidecar sleeps 24h between syncs and never restarts.
        - alert: GarageMetaBackupSidecarRestarted
          expr: |-
            increase(kube_pod_container_status_restarts_total{namespace="volsync-system", container="backup-sync"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              garage-meta backup sidecar restarted in the last hour (rsync to NFS likely failed)

        # Catches the silent-failure case where Kubernetes can't schedule the
        # sidecar at all (e.g. backup-sync container never running).
        - alert: GarageMetaBackupSidecarAbsent
          expr: |-
            absent(kube_pod_container_status_running{namespace="volsync-system", container="backup-sync"} == 1)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              garage-meta backup-sync container has been missing for 15m (off-node Garage meta backup is not running)
