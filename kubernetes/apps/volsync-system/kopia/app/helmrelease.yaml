---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopia
  namespace: volsync-system
spec:
  chartRef:
    kind: OCIRepository
    name: kopia
  interval: 1h
  values:
    controllers:
      kopia:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.23.1@sha256:27da0a33b44e1b902150a6c963514237217464bb13118a95bb056667be93cda5
            env:
              KOPIA_WEB_ENABLED: true
              KOPIA_WEB_PORT: &port 80
              TZ: America/New_York
              XDG_CACHE_HOME: /config/cache
            envFrom:
              - secretRef:
                  name: kopia-secret
            # Kopia 0.23 forces --without-password to bind loopback-only,
            # so we run an authenticated server instead. The image's
            # entrypoint already passes --insecure (Envoy terminates TLS).
            args:
              - --server-username=$(KOPIA_SERVER_USERNAME)
              - --server-password=$(KOPIA_SERVER_PASSWORD)
              - --disable-csrf-token-checks
            probes:
              # Kopia's HTTP server briefly goes unresponsive during snapshot
              # work / repository maintenance. The previous 1s timeout +
              # failureThreshold 3 (= 30s before restart) was triggering 1-2
              # restarts per day. Loosen to 5s timeout + 6 failures (= 60s)
              # so transient load doesn't kill the pod.
              #
              # TCP probe (not HTTP): with --server-username/--server-password
              # enabled, kopia returns 401 on every endpoint including '/',
              # which kubelet's httpGet treats as failure. TCP just confirms
              # the listener is up — sufficient for liveness/readiness.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: storage
            conditions:
              - "[STATUS] == 401"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Storage
          gethomepage.dev/name: Kopia
          gethomepage.dev/icon: kopia.png
          gethomepage.dev/description: Backup Repository
          gethomepage.dev/href: "https://kopia.00o.sh"
          gethomepage.dev/widget.type: kopia
          gethomepage.dev/widget.url: "http://kopia.volsync-system.svc.cluster.local:80"
          gethomepage.dev/widget.username: "{{`{{HOMEPAGE_VAR_KOPIA_USERNAME}}`}}"
          gethomepage.dev/widget.password: "{{`{{HOMEPAGE_VAR_KOPIA_PASSWORD}}`}}"
        hostnames:
          - "{{ .Release.Name }}.00o.sh"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    configMaps:
      config:
        data:
          repository.config: |-
            {
              "storage": {
                "type": "filesystem",
                "config": {
                  "path": "/repository"
                }
              },
              "hostname": "volsync.{{ .Release.Namespace }}.svc.cluster.local",
              "username": "volsync",
              "description": "volsync",
              "enableActions": false
            }
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/repository.config
            subPath: repository.config
      repository:
        type: nfs
        server: nas.3226texas.com
        path: /mnt/Speed/VolsyncKopia
        globalMounts:
          - path: /repository
      tmpfs:
        type: emptyDir
        advancedMounts:
          kopia:
            app:
              - path: /config/cache
                subPath: cache
              - path: /config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp