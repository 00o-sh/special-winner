---
# ServiceAccount + RBAC for Garage's kubernetes-discovery feature. Garage
# uses a `GarageNode` CRD entry per peer to advertise itself and discover
# others, so each instance needs to read/write that CRD across the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-ha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garage-ha
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - deuxfleurs.fr
    resources:
      - garagenodes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: garage-ha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-ha
subjects:
  - kind: ServiceAccount
    name: garage-ha
    namespace: volsync-system
