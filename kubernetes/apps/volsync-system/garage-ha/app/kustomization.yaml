---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./persistentvolumes.yaml
  - ./rbac.yaml
  - ./storageclass.yaml
configMapGenerator:
  - name: garage-ha
    files:
      - ./resources/configuration.toml
generatorOptions:
  disableNameSuffixHash: true
