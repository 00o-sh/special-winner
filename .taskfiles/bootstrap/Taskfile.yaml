---
# Bootstrap tasks for initial cluster setup.
# Usage: task bootstrap:talos    (install Talos on nodes)
#        task bootstrap:apps     (install Flux, Cilium, CoreDNS, and sync cluster)
#        task bootstrap:postgres-recovery  (restore PostgreSQL from S3 backup)
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      - '[ -f talsecret.sops.yaml ] || talhelper gensecret | sops --filename-override talos/talsecret.sops.yaml --encrypt /dev/stdin > talsecret.sops.yaml'
      - talhelper genconfig
      - talhelper gencommand apply --extra-flags="--insecure" | bash
      - until talhelper gencommand bootstrap | bash; do sleep 10; done
      - until talhelper gencommand kubeconfig --extra-flags="{{.ROOT_DIR}} --force" | bash; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - which talhelper talosctl sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}

  postgres-recovery:
    desc: Restore PostgreSQL from Garage S3 backup (run after bootstrap:apps, before Flux deploys postgres-cluster)
    cmds:
      - kubectl create namespace database --dry-run=client -o yaml | kubectl apply -f -
      - echo "Waiting for onepassword ClusterSecretStore..."
      - until kubectl get clustersecretstore onepassword -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -q "True"; do sleep 5; done
      - echo "Applying PostgreSQL recovery manifest..."
      - kubectl apply -k {{.KUBERNETES_DIR}}/apps/database/cloudnative-pg/recovery/
      - echo "Waiting for PostgreSQL cluster to be ready..."
      - until kubectl -n database get cluster postgres -o jsonpath='{.status.phase}' 2>/dev/null | grep -q "Cluster in healthy state"; do sleep 10; done
      - echo "PostgreSQL restored successfully. Flux will now manage the cluster."
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -d {{.KUBERNETES_DIR}}/apps/database/cloudnative-pg/recovery
