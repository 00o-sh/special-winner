# Development environment configuration for mise (https://mise.jdx.dev/)
# Run `mise trust && mise install` to install all tools.
# Versions are pinned for reproducibility; Renovate updates them automatically.

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
# Language runtimes
"python" = "3.14.4"                            # Required for makejinja template rendering

# Container tools
"crane" = "0.20.7"                             # Container image inspection and management

# Template rendering
"pipx:makejinja" = "2.8.2"                     # Jinja2 template engine for cluster configuration

# Talos Linux management
"aqua:budimanjojo/talhelper" = "3.1.7"         # Talos config generator and helper
"aqua:siderolabs/talos" = "1.12.6"            # Talos CLI (talosctl) for node management

# Kubernetes tools
"aqua:kubernetes/kubectl" = "1.34.0"           # Kubernetes CLI
"aqua:helm/helm" = "4.1.4"                    # Helm v4 package manager (breaking changes from v3)
"aqua:helmfile/helmfile" = "1.4.4"            # Declarative Helm chart management
"aqua:fluxcd/flux2" = "2.8.5"                 # Flux CD GitOps toolkit CLI
"aqua:kubernetes-sigs/kustomize" = "5.7.1"    # Kustomize for manifest composition
"aqua:yannh/kubeconform" = "0.7.0"            # Kubernetes manifest validation
"aqua:derailed/k9s" = "0.50.18"               # Terminal-based Kubernetes dashboard
"aqua:kubevirt/kubevirt/virtctl" = "1.8.1"    # KubeVirt VM management CLI

# Networking
"aqua:cilium/cilium-cli" = "0.19.2"           # Cilium CNI management and connectivity testing
"aqua:cloudflare/cloudflared" = "2026.3.0"    # Cloudflare Tunnel client

# Secret management
"aqua:FiloSottile/age" = "1.3.1"              # Age encryption for SOPS
"aqua:getsops/sops" = "3.12.2"               # Secret encryption in Git
"aqua:1password/cli" = "2.34.0"             # 1Password CLI

# Utilities
"aqua:cli/cli" = "2.90.0"                     # GitHub CLI (gh)
"aqua:go-task/task" = "3.50.0"               # Task runner (Taskfile.yaml)
"aqua:cue-lang/cue" = "0.16.1"              # CUE schema validation for config files
"aqua:jqlang/jq" = "1.8.1"                  # JSON processor
"aqua:mikefarah/yq" = "4.53.2"              # YAML processor
