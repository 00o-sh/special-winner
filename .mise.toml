# Development environment configuration for mise (https://mise.jdx.dev/)
# Run `mise trust && mise install` to install all tools.
# Versions are pinned for reproducibility; Renovate updates them automatically.

[settings]
experimental = true  # Required for custom backends (mise-krew)

[plugins]
# Backend for installing krew kubectl plugins via mise. Pinned to a commit
# SHA (not the tag) because mise can't fetch annotated tags via `#ref`.
# renovate: datasource=github-tags depName=soupglasses/mise-krew
krew = "https://github.com/soupglasses/mise-krew#49c405114856112d2d4cc1eb55eddee0249f5f51" # 2.1.0

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
# Language runtimes
"python" = "3.14.6"                            # Required for makejinja template rendering

# Container tools
"crane" = "0.21.7"                             # Container image inspection and management

# Template rendering
"pipx:makejinja" = "2.8.2"                     # Jinja2 template engine for cluster configuration

# Talos Linux management
"aqua:budimanjojo/talhelper" = "3.1.15"         # Talos config generator and helper
"aqua:siderolabs/talos" = "1.13.7"            # Talos CLI (talosctl) for node management

# Kubernetes tools
"aqua:kubernetes/kubectl" = "1.34.0"           # Kubernetes CLI
"aqua:helm/helm" = "4.2.3"                    # Helm v4 package manager (breaking changes from v3)
"aqua:helmfile/helmfile" = "1.7.2"            # Declarative Helm chart management
"aqua:fluxcd/flux2" = "2.9.3"                 # Flux CD GitOps toolkit CLI
"aqua:kubernetes-sigs/kustomize" = "5.7.1"    # Kustomize for manifest composition
"aqua:yannh/kubeconform" = "0.8.0"            # Kubernetes manifest validation
"aqua:derailed/k9s" = "0.51.0"               # Terminal-based Kubernetes dashboard
"aqua:kubevirt/kubevirt/virtctl" = "1.8.4"    # KubeVirt VM management CLI

# kubectl plugins (via mise-krew backend; registered in [plugins])
"krew:tree" = "v0.6.0"                        # kubectl tree (owner-reference graph)
"krew:node-shell" = "v1.11.0"                 # Shell into a node via privileged pod (Talos-friendly)
"krew:cnpg" = "v1.29.1"                       # CloudNativePG cluster operations

# Networking
"aqua:cilium/cilium-cli" = "0.19.2"           # Cilium CNI management and connectivity testing
"aqua:cloudflare/cloudflared" = "2026.7.3"    # Cloudflare Tunnel client

# Secret management
"aqua:FiloSottile/age" = "1.3.1"              # Age encryption for SOPS
"aqua:getsops/sops" = "3.13.3"               # Secret encryption in Git
"aqua:1password/cli" = "2.35.0"             # 1Password CLI

# Utilities
"aqua:cli/cli" = "2.96.0"                     # GitHub CLI (gh)
"aqua:go-task/task" = "3.52.0"               # Task runner (Taskfile.yaml)
"aqua:cue-lang/cue" = "0.17.1"              # CUE schema validation for config files
"aqua:jqlang/jq" = "1.8.1"                  # JSON processor
"aqua:mikefarah/yq" = "4.53.3"              # YAML processor
"aqua:tmux/tmux-builds" = "3.6a"            # Terminal multiplexer (prebuilt binaries)

# AI
"claude-code" = "2.1.220"
